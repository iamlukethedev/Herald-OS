# greetd.service.d/herald-os-login.conf on the Herald OS image. greetd starts only once
# herald-os-login.service has succeeded, so a switched system's session user is locked and its login
# screen in place before greetd reads its config. Ordering alone (Before=) would let greetd start
# after a failure, with the stock config that signs the session user in without asking.
[Unit]
Requires=herald-os-login.service
After=herald-os-login.service
