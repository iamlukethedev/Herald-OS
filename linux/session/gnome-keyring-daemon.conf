# The keyring (Secret Service) for Herald OS: gnome-keyring's secrets component only. Fedora's unit
# also starts its PKCS#11 component, which nothing in the session uses. Installed as a drop-in for
# gnome-keyring-daemon.service by linux/image/packages.sh, which enables the socket that starts it.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-keyring-daemon --foreground --components=secrets --control-directory=%t/keyring
