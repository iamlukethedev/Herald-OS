# xdg-desktop-portal's backends for the Herald OS session (XDG_CURRENT_DESKTOP=HeraldOS, read as
# heraldos-portals.conf). Installed to /usr/share/xdg-desktop-portal/ by linux/image/packages.sh and
# the Arch package. Every backend named here is in linux/image/packages.txt, and among the Arch
# package's optional dependencies: gnome (xdg-desktop-portal-gnome), gtk (xdg-desktop-portal-gtk) and
# gnome-keyring (org.freedesktop.secrets there). niri implements the GNOME interfaces the gnome backend
# uses for screenshots and screencasts; its file chooser is Nautilus, with gtk's as the fallback.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.FileChooser=gnome;gtk;
org.freedesktop.impl.portal.Screenshot=gnome;
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.Secret=gnome-keyring;
