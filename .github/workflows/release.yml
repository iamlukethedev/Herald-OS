name: Release

# Builds what Herald OS ships. A tag (v0.2.0) attaches the builds to a draft GitHub release; a manual
# run only uploads them as workflow artifacts. Nothing here makes the repository or a release public.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Every job asks for what it needs; only the release job can write.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: macOS app (signed and notarized when the secrets are set)
    runs-on: macos-latest
    # The five signing secrets live in this environment, whose deployment rules admit only main and
    # v* tags (docs/MACOS-SIGNING.md). Each step below gets only the secrets it uses.
    environment: macos-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch the pinned Hermes Agent snapshot
        run: npm run sync-upstream
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run the install scripts the Mac build needs
        # node-pty's install checks for the runner's darwin-arm64 prebuild and compiles one if it is
        # missing; the Intel build packs the darwin-x64 prebuild from the same npm tarball. esbuild's
        # install checks its native binary. Nothing else in the tree needs one for this build.
        run: npm rebuild node-pty esbuild
      - name: Build the renderer and the Electron bundles
        run: npm run build --workspace apps/desktop
      - name: Check the signing secrets
        id: signing
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # A build is signed only with all five: electron-builder fails outright when APPLE_ID is set
        # without the other two notarization secrets, and a signed but unnotarized app still trips
        # Gatekeeper. Missing secrets never fail the job; the build goes out unsigned with a warning.
        # Only the names are printed, never the values.
        run: |
          missing=()
          for name in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "All five signing secrets are set: this build is signed and notarized."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            printf -v list '%s, ' "${missing[@]}"
            echo "::warning title=Unsigned macOS build::Missing secrets: ${list%, }. This build is not signed or notarized. See docs/MACOS-SIGNING.md."
          fi
      - name: Check the mac signing config
        # Also checks that this workflow signs unsigned builds ad hoc and checks every build's signature.
        run: |
          node apps/desktop/scripts/check-mac-signing-config.mjs
          plutil -lint apps/desktop/build/entitlements.mac.plist
      - name: Package, sign and notarize the app
        if: steps.signing.outputs.signed == 'true'
        env:
          # A Developer ID Application certificate as a base64 .p12, and its password.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # electron-builder notarizes and staples the app through @electron/notarize with these.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run pack:mac --workspace apps/desktop -- -c.dmg.sign=true
      - name: Package the app, signed ad hoc
        if: steps.signing.outputs.signed != 'true'
        env:
          # Never pick up a stray identity from the runner's keychain for an unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # identity "-" signs the whole bundle ad hoc, inside out, after afterPack and before the DMG
        # and zip are made. Without it the app keeps only the linker's per-binary signatures, with no
        # sealed resources, and macOS reports the downloaded app as damaged.
        run: npm run pack:mac --workspace apps/desktop -- -c.mac.notarize=false -c.mac.identity=-
      - name: Check the Apple Silicon and Intel builds
        # One app, DMG and zip per architecture; every Mach-O in each app is built for its architecture alone.
        run: node apps/desktop/scripts/check-mac-builds.mjs
      - name: Check the code signatures
        # Every app, as packed and inside each zip and DMG, signed or not: codesign --verify --deep
        # --strict passes, and the signature covers the bundle (sealed resources, bound Info.plist).
        run: node apps/desktop/scripts/check-mac-signatures.mjs
      - name: Notarize and staple the DMGs
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # electron-builder notarizes only the app inside; the DMG around it is a separate submission.
        run: |
          shopt -s nullglob
          dmgs=(apps/desktop/release/*.dmg)
          (( ${#dmgs[@]} )) || { echo "::error::No DMG under apps/desktop/release"; exit 1; }
          for dmg in "${dmgs[@]}"; do
            result="$RUNNER_TEMP/notarytool-$(basename "$dmg").json"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 1h --output-format json > "$result" || true
            status="$(jq -r '.status // empty' "$result" 2>/dev/null || true)"
            if [[ "$status" != "Accepted" ]]; then
              echo "::error::Notarization of $(basename "$dmg") ended as '${status:-no result}'"
              id="$(jq -r '.id // empty' "$result" 2>/dev/null || true)"
              [[ -z "$id" ]] || xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
              exit 1
            fi
            xcrun stapler staple "$dmg"
          done
      - name: Verify the signatures and the notarization tickets
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/*/"Herald OS.app")
          (( ${#apps[@]} )) || { echo "::error::No Herald OS.app under apps/desktop/release"; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            details="$(codesign --display --verbose=4 "$app" 2>&1)"
            grep -q '^Authority=Developer ID Application:' <<<"$details" || { echo "::error::$app is not signed with a Developer ID Application certificate"; exit 1; }
            grep -q "^TeamIdentifier=$APPLE_TEAM_ID\$" <<<"$details" || { echo "::error::$app is not signed by the team in APPLE_TEAM_ID"; exit 1; }
            grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]*\(.*runtime' <<<"$details" || { echo "::error::$app is not signed with the hardened runtime"; exit 1; }
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done
          for dmg in apps/desktop/release/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
          done
          # A zip cannot carry a ticket; check that the app it ships is the stapled one.
          for zip in apps/desktop/release/*.zip; do
            dir="$(mktemp -d)"
            ditto -x -k "$zip" "$dir"
            xcrun stapler validate "$dir/Herald OS.app"
            spctl --assess --type execute -vv "$dir/Herald OS.app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: herald-os-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  linux:
    name: Linux tarball (${{ matrix.arch }})
    # Native runners per architecture: node-pty is compiled for the target, not cross-built.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build tools for node-pty
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
      - name: Fetch the pinned Hermes Agent snapshot
        run: npm run sync-upstream
      - run: npm ci
      - name: Build the tarball
        run: npm run dist:linux --workspace apps/desktop -- --${{ matrix.arch }}
      - name: Check what the tarball carries
        run: |
          tarball="$(ls apps/desktop/release/herald-os-*-linux-*.tar.gz)"
          listing="$(tar -tzf "$tarball")"
          for required in /herald-os /resources/app.asar /resources/herald-os-linux/bin/herald-os /resources/herald-os-linux/bin/herald-os-catalog \
            /resources/herald-os-linux/session/herald-os-session /resources/themes/ /resources/catalog/ai.json /resources/herald-os-bridge/plugin.yaml; do
            grep -q -- "$required" <<<"$listing" || { echo "::error::$required is missing from $tarball"; exit 1; }
          done
          # Named as downloaded, so sha256sum -c works next to the download.
          (cd "$(dirname "$tarball")" && sha256sum "$(basename "$tarball")") | tee "$tarball.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: herald-os-linux-${{ matrix.arch }}
          path: |
            apps/desktop/release/herald-os-*-linux-*.tar.gz
            apps/desktop/release/herald-os-*-linux-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Attach to the draft release
    needs: [mac, linux]
    # Attach whatever built, as each platform's own job used to, even when another platform failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: herald-os-*
          path: dist
          merge-multiple: true
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/herald-os-*-linux-*.tar.gz dist/herald-os-*-linux-*.tar.gz.sha256)
          (( ${#files[@]} )) || { echo "::error::No build artifacts to attach"; exit 1; }
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Herald OS $GITHUB_REF_NAME" --notes "Draft written by the release workflow."
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
