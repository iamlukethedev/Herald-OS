name: Herald OS image

# The Fedora bootc image (ADR-018) per architecture on matching runners, pushed to the repository's
# GHCR package, joined into one multi-arch tag; then the installer ISO
# (x86_64) and the VM disk (aarch64) from it. A tag attaches the disks to the draft release; nothing
# here makes the image, the package or a release public.

on:
  push:
    tags: ['v*']
    # main publishes the edge channel (`herald-os channel edge`); only changes that reach the image.
    branches: [main]
    paths:
      - 'linux/**'
      - 'apps/**'
      - 'packages/**'
      - 'plugins/**'
      - 'upstream/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      disks:
        description: Also build the ISO and the VM disk
        type: boolean
        default: false

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/herald-os
  # Signing waits for the key (cosign generate-key-pair; the public half goes in linux/image/cosign.pub).
  SIGNING: ${{ secrets.COSIGN_PRIVATE_KEY != '' && 'true' || 'false' }}

jobs:
  channel:
    name: Channel
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
    steps:
      - name: Pick the image tag
        id: pick
        # Tags are releases (stable) and main is edge; a manual run from any other ref gets its own
        # dev-<commit> tag, so it never replaces a channel that installed machines follow.
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) channel=stable ;;
            refs/heads/main) channel=edge ;;
            *) channel="dev-${GITHUB_SHA::7}" ;;
          esac
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "Image tag: $channel"

  image:
    name: Image (${{ matrix.arch }})
    needs: channel
    permissions:
      contents: read
      packages: write
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            shell: x64
            runner: ubuntu-24.04
          - arch: arm64
            shell: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refuse to ship the signature policy without signing
        # With linux/image/cosign.pub in the tree, the image only accepts signed updates of itself, so an
        # unsigned build would stop installed machines from updating (#18).
        run: |
          if [[ -f linux/image/cosign.pub && "$SIGNING" != "true" ]]; then
            echo "::error::linux/image/cosign.pub is committed but COSIGN_PRIVATE_KEY is not set: this image would be unsigned."
            exit 1
          fi
      - uses: sigstore/cosign-installer@v3
        if: env.SIGNING == 'true'
      - name: Check the signing key matches cosign.pub
        # Signing with a key other than the committed one ships signatures that installed machines reject.
        if: env.SIGNING == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [[ ! -f linux/image/cosign.pub ]]; then
            echo "linux/image/cosign.pub is not committed: images are signed but machines do not verify them yet."
            exit 0
          fi
          cosign public-key --key env://COSIGN_PRIVATE_KEY >derived.pub
          if ! diff -u linux/image/cosign.pub derived.pub; then
            echo "::error::COSIGN_PRIVATE_KEY does not match linux/image/cosign.pub: installed machines would reject this image's signature."
            exit 1
          fi
          rm derived.pub
          echo "COSIGN_PRIVATE_KEY matches linux/image/cosign.pub."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the shell for this architecture
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
          npm run sync-upstream
          npm ci
          npm run dist:linux --workspace apps/desktop -- --${{ matrix.shell }}
          cp apps/desktop/release/herald-os-*-linux-${{ matrix.shell }}.tar.gz herald-os-linux.tar.gz
      - name: Build the image
        run: |
          sudo podman build -f linux/image/Containerfile --build-arg SHELL_TARBALL=herald-os-linux.tar.gz \
            -t "$IMAGE:$CHANNEL-${{ matrix.arch }}" .
      - name: Push it
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push --digestfile digest.txt "$IMAGE:$CHANNEL-${{ matrix.arch }}"
      - name: Sign it with the project's key
        if: env.SIGNING == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # A key, not keyless: no identity or entry goes to the public transparency log.
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$IMAGE@$(cat digest.txt)"

  manifest:
    name: Multi-arch tag
    needs: [channel, image]
    permissions:
      packages: write
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
    runs-on: ubuntu-24.04
    steps:
      - name: Join both architectures under one tag
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create "$IMAGE:$CHANNEL" "$IMAGE:$CHANNEL-amd64" "$IMAGE:$CHANNEL-arm64"
          podman manifest push --all --digestfile digest.txt "$IMAGE:$CHANNEL" "docker://$IMAGE:$CHANNEL"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            podman manifest push --all "$IMAGE:$CHANNEL" "docker://$IMAGE:${GITHUB_REF_NAME#v}"
          fi
      - uses: sigstore/cosign-installer@v3
        if: env.SIGNING == 'true'
      - name: Sign the multi-arch tag
        if: env.SIGNING == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$IMAGE@$(cat digest.txt)"

  disks:
    name: ${{ matrix.type }} (${{ matrix.arch }})
    needs: [channel, manifest]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.disks
    permissions:
      contents: read
      packages: read
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            type: anaconda-iso
            config: iso.toml
          - arch: arm64
            runner: ubuntu-24.04-arm
            type: qcow2
            config: disk.toml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the disk with bootc-image-builder
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE:$CHANNEL-${{ matrix.arch }}"
          mkdir -p output
          # Pinned to the builder's last multi-arch build: its latest tag became amd64-only on 13 October 2026.
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./output:/output -v "./linux/image/${{ matrix.config }}:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b \
            --type ${{ matrix.type }} --rootfs btrfs --local "$IMAGE:$CHANNEL-${{ matrix.arch }}"
      - name: Name, compress and split it
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="${CHANNEL%%-*}-$(git rev-parse --short HEAD)"
          sudo chown -R "$(id -u)" output
          if [[ "${{ matrix.type }}" == "anaconda-iso" ]]; then
            file="herald-os-$version-x86_64.iso"
            mv output/bootiso/install.iso "$file"
          else
            file="herald-os-$version-aarch64.qcow2.zst"
            zstd -T0 -19 -q output/qcow2/disk.qcow2 -o "$file"
          fi
          sha256sum "$file" >"$file.sha256"
          size="$(stat -c %s "$file")"
          echo "$file: $((size / 1024 / 1024)) MiB"
          # GitHub refuses release assets of 2 GiB or more, so a bigger disk goes up in parts
          # (.part0, .part1, …) that cat joins again; the .sha256 is the whole file's.
          if (( size >= 2147483648 )); then
            split -b 1900M -d -a 1 "$file" "$file.part"
            rm "$file"
          fi
          ls -l "$file"*
          echo "DISK=$file" >>"$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: herald-os-${{ matrix.type }}-${{ matrix.arch }}
          path: ${{ env.DISK }}*
          if-no-files-found: error

  release:
    name: Attach to the draft release
    needs: disks
    if: startsWith(github.ref, 'refs/tags/v')
    # The only job that writes to the repository: it creates the draft release and uploads the disks.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: herald-os-*
          path: disks
          merge-multiple: true
      - name: Upload the disks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l disks
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Herald OS $GITHUB_REF_NAME" --notes "Draft written by the release workflow."
          gh release upload "$GITHUB_REF_NAME" disks/* --clobber
