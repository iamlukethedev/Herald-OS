name: Herald OS image

# The Fedora bootc image (ADR-018) per architecture on matching runners, pushed to the repository's
# GHCR package, joined into one multi-arch tag; then the installer ISO (x86_64) and the VM disks from
# it: a qcow2 for both architectures, a Hyper-V VHDX (x86_64) and a UTM bundle (aarch64), packaged by
# linux/vm/package-disk.sh. A tag attaches the disks to the draft release; nothing here makes the
# image, the package or a release public. Next to it, the NVIDIA image (ADR-029): x86_64 only, in a
# package of its own (herald-os-nvidia) under the channel's tag itself, with no disks of its own.

on:
  push:
    tags: ['v*']
    # main publishes the edge channel (`herald-os channel edge`); only changes that reach the image.
    branches: [main]
    paths:
      - 'linux/**'
      - 'apps/**'
      - 'packages/**'
      - 'plugins/**'
      - 'upstream/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/image.yml'
  workflow_dispatch:
    inputs:
      disks:
        description: Also build the ISO and the VM disk
        type: boolean
        default: false

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/herald-os
  # Signing waits for the key (cosign generate-key-pair; the public half goes in linux/image/cosign.pub).
  SIGNING: ${{ secrets.COSIGN_PRIVATE_KEY != '' && 'true' || 'false' }}

jobs:
  channel:
    name: Channel
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
    steps:
      - name: Pick the image tag
        id: pick
        # Tags are releases (stable) and main is edge; a manual run from any other ref gets its own
        # dev-<commit> tag, so it never replaces a channel that installed machines follow.
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) channel=stable ;;
            refs/heads/main) channel=edge ;;
            *) channel="dev-${GITHUB_SHA::7}" ;;
          esac
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "Image tag: $channel"

  image:
    name: Image (${{ matrix.label }})
    needs: channel
    permissions:
      contents: read
      packages: write
    # The NVIDIA image waits on Universal Blue's modules for each new kernel; until they are out it
    # fails, and that must not hold back the default image's multi-arch tag or its disks.
    continue-on-error: ${{ matrix.image == 'herald-os-nvidia' }}
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
      # The default image goes out as one tag per architecture, joined by the manifest job; the
      # NVIDIA image, x86_64 only, as the channel's.
      REPO: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      TAG: ${{ needs.channel.outputs.channel }}${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            label: amd64
            image: herald-os
            suffix: -amd64
            shell: x64
            runner: ubuntu-24.04
          - arch: arm64
            label: arm64
            image: herald-os
            suffix: -arm64
            shell: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            label: amd64, NVIDIA
            image: herald-os-nvidia
            suffix: ''
            shell: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make room for the NVIDIA image
        # Two images (the default one it starts from, then the NVIDIA one) and the akmods images.
        if: matrix.image == 'herald-os-nvidia'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Refuse to ship the signature policy without signing
        # With linux/image/cosign.pub in the tree, the image only accepts signed updates of itself, so an
        # unsigned build would stop installed machines from updating (#18).
        run: |
          if [[ -f linux/image/cosign.pub && "$SIGNING" != "true" ]]; then
            echo "::error::linux/image/cosign.pub is committed but COSIGN_PRIVATE_KEY is not set: this image would be unsigned."
            exit 1
          fi
      - uses: sigstore/cosign-installer@v3
        # The NVIDIA leg also checks Universal Blue's signatures on the akmods images.
        if: env.SIGNING == 'true' || matrix.image == 'herald-os-nvidia'
      - name: Check the signing key matches cosign.pub
        # Signing with a key other than the committed one ships signatures that installed machines reject.
        if: env.SIGNING == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [[ ! -f linux/image/cosign.pub ]]; then
            echo "linux/image/cosign.pub is not committed: images are signed but machines do not verify them yet."
            exit 0
          fi
          cosign public-key --key env://COSIGN_PRIVATE_KEY >derived.pub
          # Compared as DER so PEM formatting (line endings, wrapping, trailing newline) cannot matter.
          openssl pkey -pubin -in linux/image/cosign.pub -outform DER -out committed.der
          openssl pkey -pubin -in derived.pub -outform DER -out derived.der
          if ! cmp -s committed.der derived.der; then
            echo "::error::COSIGN_PRIVATE_KEY does not match linux/image/cosign.pub: installed machines would reject this image's signature."
            exit 1
          fi
          rm derived.pub committed.der derived.der
          echo "COSIGN_PRIVATE_KEY matches linux/image/cosign.pub."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the shell for this architecture
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
          npm run sync-upstream
          npm ci
          npm run dist:linux --workspace apps/desktop -- --${{ matrix.shell }}
          cp apps/desktop/release/herald-os-*-linux-${{ matrix.shell }}.tar.gz herald-os-linux.tar.gz
      - name: Pin the base and the NVIDIA modules to one kernel
        if: matrix.image == 'herald-os-nvidia'
        # Universal Blue builds the modules for one kernel and tags them by it. All three images go in
        # by digest, so nothing can move between this step and the build, and the akmods images only
        # once their signature checks out against Universal Blue's key, committed in the repository.
        run: |
          base=quay.io/fedora/fedora-bootc:44
          inspect="$(skopeo inspect "docker://$base")"
          digest="$(jq -r .Digest <<<"$inspect")"
          kernel="$(jq -r '.Labels["ostree.linux"]' <<<"$inspect")"
          echo "FEDORA_BOOTC=${base%:*}@$digest" >>"$GITHUB_ENV"
          echo "Base ${base%:*}@$digest, kernel $kernel"
          for repo in akmods akmods-nvidia-open; do
            tag="ghcr.io/ublue-os/$repo:main-44-$kernel"
            if ! inspect="$(skopeo inspect "docker://$tag")"; then
              echo "::error::Universal Blue has not published $tag for kernel $kernel yet; the default image is not affected."
              exit 1
            fi
            ref="ghcr.io/ublue-os/$repo@$(jq -r .Digest <<<"$inspect")"
            cosign verify --key linux/image/ublue-os-akmods-cosign.pub "$ref" >/dev/null
            echo "$tag is $ref (signature verified)"
            name="AKMODS_REF"
            [[ "$repo" == akmods ]] || name="AKMODS_NVIDIA_REF"
            echo "$name=$ref" >>"$GITHUB_ENV"
          done
      - name: Build the image
        run: |
          base=(--build-arg SHELL_TARBALL=herald-os-linux.tar.gz)
          if [[ "${{ matrix.image }}" != herald-os-nvidia ]]; then
            sudo podman build -f linux/image/Containerfile "${base[@]}" -t "$REPO:$TAG" .
            exit 0
          fi
          # The default image from the pinned base, then the NVIDIA layer on it.
          sudo podman build -f linux/image/Containerfile "${base[@]}" --build-arg "FEDORA_BOOTC=$FEDORA_BOOTC" \
            -t localhost/herald-os .
          sudo podman build -f linux/image/Containerfile.nvidia --build-arg HERALD_OS=localhost/herald-os \
            --build-arg "AKMODS_REF=$AKMODS_REF" --build-arg "AKMODS_NVIDIA_REF=$AKMODS_NVIDIA_REF" -t "$REPO:$TAG" .
      - name: Push it
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push --digestfile digest.txt "$REPO:$TAG"
          # An image without per-architecture tags has no manifest job to give a release its version tag.
          if [[ -z "${{ matrix.suffix }}" && "$GITHUB_REF" == refs/tags/v* ]]; then
            sudo podman push "$REPO:$TAG" "docker://$REPO:${GITHUB_REF_NAME#v}"
          fi
      - name: Sign it with the project's key
        if: env.SIGNING == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # A key, not keyless: no identity or entry goes to the public transparency log.
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$REPO@$(cat digest.txt)"
      - name: Say that the NVIDIA image did not go out
        # continue-on-error keeps the run green, so the failure would otherwise go unseen.
        if: failure() && matrix.image == 'herald-os-nvidia'
        run: |
          msg="The NVIDIA image ($REPO:$TAG) was not built or pushed; its tags keep the last build. Usually Universal Blue has no modules for the new kernel yet; the log of this job says."
          echo "::warning title=NVIDIA image not published::$msg"
          echo "- :warning: $msg" >>"$GITHUB_STEP_SUMMARY"

  manifest:
    name: Multi-arch tag
    needs: [channel, image]
    permissions:
      packages: write
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
    runs-on: ubuntu-24.04
    steps:
      - name: Join both architectures under one tag
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create "$IMAGE:$CHANNEL" "$IMAGE:$CHANNEL-amd64" "$IMAGE:$CHANNEL-arm64"
          podman manifest push --all --digestfile digest.txt "$IMAGE:$CHANNEL" "docker://$IMAGE:$CHANNEL"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            podman manifest push --all "$IMAGE:$CHANNEL" "docker://$IMAGE:${GITHUB_REF_NAME#v}"
          fi
      - uses: sigstore/cosign-installer@v3
        if: env.SIGNING == 'true'
      - name: Sign the multi-arch tag
        if: env.SIGNING == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$IMAGE@$(cat digest.txt)"

  disks:
    name: ${{ matrix.type }} (${{ matrix.arch }})
    needs: [channel, manifest]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.disks
    permissions:
      contents: read
      packages: read
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            type: anaconda-iso
            config: iso.toml
          - arch: amd64
            runner: ubuntu-24.04
            type: qcow2
            config: disk.toml
          - arch: arm64
            runner: ubuntu-24.04-arm
            type: qcow2
            config: disk.toml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make room for the VM disks
        # The qcow2, its .zst and the VHDX or UTM bundle are on the runner's disk at once.
        if: matrix.type == 'qcow2'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils zip zstd
          df -h .
      - name: Build the disk with bootc-image-builder
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE:$CHANNEL-${{ matrix.arch }}"
          mkdir -p output
          # Pinned to the builder's last multi-arch build: its latest tag became amd64-only on 13 October 2026.
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./output:/output -v "./linux/image/${{ matrix.config }}:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b \
            --type ${{ matrix.type }} --rootfs btrfs --local "$IMAGE:$CHANNEL-${{ matrix.arch }}"
          # The disk is built; the images only take the room packaging needs.
          sudo podman rmi --ignore "$IMAGE:$CHANNEL-${{ matrix.arch }}" \
            quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
          df -h .
      - name: Name, compress and split it
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="${CHANNEL%%-*}-$(git rev-parse --short HEAD)"
          sudo chown -R "$(id -u)" output
          # Over 2 GiB, a file goes up in parts that join again; the .sha256 is the whole file's and
          # the .sha256sums has each part's.
          bash linux/vm/package-disk.sh output "${{ matrix.arch }}" "$version" dist
          df -h .
      - uses: actions/upload-artifact@v4
        with:
          name: herald-os-${{ matrix.type }}-${{ matrix.arch }}
          path: dist/herald-os-*
          if-no-files-found: error

  release:
    name: Attach to the draft release
    needs: disks
    if: startsWith(github.ref, 'refs/tags/v')
    # The only job that writes to the repository: it creates the draft release, uploads the disks and
    # signs SHA256SUMS with the release key from this environment (docs/RELEASE-SIGNING.md).
    environment: release-signing
    # One SHA256SUMS covers these disks and the release workflow's files. Each writes it from every
    # .sha256 on the release, one at a time, so the one that finishes second lists them all.
    concurrency:
      group: release-sums-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            linux/keys
      - uses: actions/download-artifact@v4
        with:
          pattern: herald-os-*
          path: disks
          merge-multiple: true
      - name: Upload the disks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l disks
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Herald OS $GITHUB_REF_NAME" --notes "Draft written by the release workflow."
          gh release upload "$GITHUB_REF_NAME" disks/* --clobber
      - name: Write and sign SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
          RELEASE_FORK: ${{ github.event.repository.fork }}
        # Unsigned, the release keeps no signature or key file from an earlier run of this job.
        run: |
          mkdir -p sums signed
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums --clobber
          bash scripts/release-sums.sh sums signed
          gh release upload "$GITHUB_REF_NAME" signed/* --clobber
          attached="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for stale in SHA256SUMS.sig herald-os-release-key.asc; do
            if [[ ! -f "signed/$stale" ]] && grep -qx "$stale" <<<"$attached"; then
              gh release delete-asset "$GITHUB_REF_NAME" "$stale" --yes
            fi
          done
